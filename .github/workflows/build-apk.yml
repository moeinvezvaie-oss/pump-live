name: Build Pump Live APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract Pump Live v4 project
        run: |
          rm -rf pump_live_flutter
          unzip -o pump_live_android_v4.zip

      - name: Create Android project files
        working-directory: pump_live_flutter
        run: |
          flutter create . --platforms=android
          flutter pub get

      - name: Add Android permissions and native chooser
        working-directory: pump_live_flutter
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          s = manifest.read_text()

          perms = '''<uses-permission android:name="android.permission.INTERNET" />
          <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
          <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />'''

          if 'ACCESS_FINE_LOCATION' not in s:
              s = s.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\\n    ' + perms
              )

          manifest.write_text(s)

          main_activity = Path(
              "android/app/src/main/kotlin/com/example/pump_live/MainActivity.kt"
          )

          main_activity.parent.mkdir(parents=True, exist_ok=True)

          main_activity.write_text(r'''package com.example.pump_live

          import android.content.Intent
          import android.net.Uri
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              private val channelName = "pump_live/navigation"

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)

                  MethodChannel(
                      flutterEngine.dartExecutor.binaryMessenger,
                      channelName
                  ).setMethodCallHandler { call, result ->

                      if (call.method == "openNavigationChooser") {

                          val lat = call.argument<Double>("lat")
                          val lon = call.argument<Double>("lon")
                          val label =
                              call.argument<String>("label") ?: "Destination"

                          if (lat == null || lon == null) {
                              result.error(
                                  "BAD_ARGS",
                                  "Missing coordinates",
                                  null
                              )
                              return@setMethodCallHandler
                          }

                          val encodedLabel = Uri.encode(label)

                          val geoUri = Uri.parse(
                              "geo:$lat,$lon?q=$lat,$lon($encodedLabel)"
                          )

                          val intent = Intent(
                              Intent.ACTION_VIEW,
                              geoUri
                          )

                          val chooser = Intent.createChooser(
                              intent,
                              "انتخاب مسیریاب"
                          )

                          startActivity(chooser)

                          result.success(true)

                      } else {
                          result.notImplemented()
                      }
                  }
              }
          }
          ''')
          PY

      - name: Build APK
        working-directory: pump_live_flutter
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pump-Live-V4-APK
          path: pump_live_flutter/build/app/outputs/flutter-apk/app-release.apk
