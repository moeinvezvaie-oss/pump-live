name: Build Pump Live APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract Pump Live project
        run: |
          unzip -o *.zip
          ls -la
          ls -la pump_live_flutter

      - name: Create Android project files
        working-directory: pump_live_flutter
        run: |
          flutter create . --platforms=android
          flutter pub get

      - name: Build APK
        working-directory: pump_live_flutter
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pump-Live-APK
          path: pump_live_flutter/build/app/outputs/flutter-apk/app-release.apk
